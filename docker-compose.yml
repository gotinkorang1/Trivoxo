# Local Postgres for development.
#   docker compose up -d
# Published on host port 5433 (not 5432) to avoid clashing with a native
# Postgres install that may already own 5432 on this machine. Matches the
# DATABASE_URI in .env.example: postgres://trivoxo:trivoxo@127.0.0.1:5433/trivoxo
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: trivoxo
      POSTGRES_PASSWORD: trivoxo
      POSTGRES_DB: trivoxo
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U trivoxo']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
